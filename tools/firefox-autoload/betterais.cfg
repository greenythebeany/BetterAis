// BetterAis autoload - first line must be a comment (autoconfig requirement).
// Loads the unpacked extension folder below as a temporary add-on every time
// Firefox starts, once the first browser window has finished starting up.
// Only this one path is loaded; signature checking stays on for everything else.
const BETTERAIS_DIR = "C:\\Users\\matus\\Documents\\BetterAis";

try {
  const startupTopic = "browser-delayed-startup-finished";
  const onStartup = function () {
    Services.obs.removeObserver(onStartup, startupTopic);
    try {
      const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
      const dir = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
      dir.initWithPath(BETTERAIS_DIR);
      if (dir.exists()) {
        AddonManager.installTemporaryAddon(dir).catch((e) => Components.utils.reportError(e));
      }
    } catch (e) {
      Components.utils.reportError(e);
    }
  };
  Services.obs.addObserver(onStartup, startupTopic);
} catch (e) {
  Components.utils.reportError(e);
}
