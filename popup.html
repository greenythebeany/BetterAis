<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --link: #7a1030;
    --font-sans: 'Roboto', -apple-system, "Segoe UI", system-ui, Arial, sans-serif;
    --font-mono: var(--font-sans); /* no monospace/terminal look anywhere */
    --radius: 8px;
    --radius-sm: 6px;
    --ease: cubic-bezier(.2, .7, .15, 1);
  }

  body.dark-mode {
    --bg: #101216;
    --surface: #171a20;
    --ink: #eef0f4;
    --mute: #8b93a3;
    --line: #262b34;
  }

  body.light-mode {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --ink: #1b2027;
    --mute: #666e7a;
    --line: #d8dce2;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-sans);
    width: 300px;
    margin: 0;
    padding: 18px;
    background: var(--bg);
    color: var(--ink);
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 16px;
    padding: 0 2px;
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--link);
    flex-shrink: 0;
  }

  .brand-name {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -.01em;
  }

  .brand-sub {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--mute);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .card-title {
    font: 600 11px/1 var(--font-mono);
    letter-spacing: .03em;
    color: var(--mute);
    margin: 0 0 12px 0;
  }

  /* theme switch: bordered track, solid accent pill on the active side */
  .segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }

  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--mute);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 0;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color .18s var(--ease), color .18s var(--ease);
  }

  .segmented-sm button {
    font-size: 12px;
    padding: 7px 0;
  }

  .segmented button.active {
    color: #fff;
    background: var(--link);
  }

  /* while the schedule is driving dark/light, the manual switch is
     shown but inert so it's clear why clicking it does nothing */
  .segmented.locked {
    opacity: .45;
    pointer-events: none;
  }

  /* dark-mode schedule */
  .schedule {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .schedule-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }

  .schedule-label {
    font-size: 12px;
    font-weight: 600;
  }

  .schedule-toggle input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .switch {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--line);
    transition: background-color .18s var(--ease);
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: transform .18s var(--ease);
  }

  .schedule-toggle input:checked + .switch {
    background: var(--link);
  }

  .schedule-toggle input:checked + .switch::after {
    transform: translateX(14px);
  }

  .schedule-toggle input:focus-visible + .switch {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--link);
  }

  .schedule-times {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .schedule-times.disabled {
    opacity: .45;
    pointer-events: none;
  }

  .time-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: var(--mute);
  }

  .time-field input {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
  }

  /* the native clock button follows color-scheme; pin it to the popup's
     own theme, not the OS one, or it renders black on the dark field */
  body.dark-mode .time-field input {
    color-scheme: dark;
  }

  body.light-mode .time-field input {
    color-scheme: light;
  }

  .time-field input::-webkit-calendar-picker-indicator {
    opacity: .6;
    cursor: pointer;
  }

  .time-field input::-webkit-calendar-picker-indicator:hover {
    opacity: 1;
  }

  .time-field input:focus {
    outline: none;
    border-color: var(--link);
  }

  .schedule-hint {
    margin: 8px 0 0;
    font-size: 11px;
    color: var(--mute);
    min-height: 1em;
  }

  .schedule-hint:empty {
    display: none;
  }

  /* color grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .color-option {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    cursor: pointer;
    position: relative;
    border: 1px solid rgba(0, 0, 0, .15);
    transition: transform .12s var(--ease), border-color .15s var(--ease);
  }

  .color-option:hover {
    transform: scale(1.08);
  }

  .color-option.selected {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor;
  }

  .color-option.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    margin: auto;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .3);
  }

  /* preset theme grid: small two-tone swatch (surface + accent) over a
     short label, 3 to a row so all ~16 presets fit without scrolling */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .theme-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 6px 2px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    cursor: pointer;
    transition: border-color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease);
  }

  .theme-chip:hover {
    transform: scale(1.04);
  }

  .theme-chip.active {
    border-color: var(--link);
    box-shadow: 0 0 0 1px var(--link);
  }

  .theme-swatch {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    aspect-ratio: 2.2 / 1;
    padding: 0 8px;
    border-radius: 5px;
    background: var(--sw-bg);
    box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .22);
  }

  .sw-dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--sw-accent);
  }

  .sw-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sw-line {
    height: 3px;
    width: 80%;
    border-radius: 2px;
    background: var(--sw-accent);
  }

  .sw-line-soft {
    width: 55%;
    opacity: .4;
  }

  .theme-chip-label {
    font-size: 10px;
    font-weight: 500;
    line-height: 1.15;
    color: var(--ink);
    text-align: center;
  }

  .button {
    display: block;
    width: 100%;
    padding: 12px;
    text-align: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: none;
    background: var(--link);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    transition: filter .12s var(--ease);
  }

  .button:hover {
    filter: brightness(1.08);
  }

  .button:active {
    filter: brightness(.94);
  }

  .credits-link {
    display: block;
    margin: 8px auto 0;
    padding: 4px 8px;
    border: none;
    background: none;
    font: 500 10px/1 var(--font-sans);
    color: var(--mute);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .credits-link:hover {
    color: var(--link);
  }

  .footer {
    text-align: center;
    font: 500 10px/1 var(--font-mono);
    color: var(--mute);
    margin-top: 14px;
  }
</style>
</head>
<body class="dark-mode">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">BetterAis</span>
    <span class="brand-sub" data-i18n="brandSub">for is.stuba.sk</span>
  </div>

  <div class="card">
    <p class="card-title" data-i18n="theme">Theme</p>
    <div class="segmented" id="themeSwitch">
      <button type="button" data-theme="dark" data-i18n="dark">Dark</button>
      <button type="button" data-theme="light" data-i18n="light">Light</button>
    </div>

    <div class="schedule">
      <label class="schedule-toggle">
        <span class="schedule-label" data-i18n="scheduleLabel">Dark mode on a schedule</span>
        <input type="checkbox" id="scheduleEnabled" />
        <span class="switch" aria-hidden="true"></span>
      </label>
      <div class="schedule-times" id="scheduleTimes">
        <label class="time-field">
          <span data-i18n="scheduleFrom">From</span>
          <input type="time" id="scheduleStart" value="22:00" />
        </label>
        <label class="time-field">
          <span data-i18n="scheduleTo">To</span>
          <input type="time" id="scheduleEnd" value="06:00" />
        </label>
      </div>
      <p class="schedule-hint" id="scheduleHint"></p>
    </div>
  </div>

  <div class="card">
    <p class="card-title" data-i18n="accent">Accent color</p>
    <div class="color-grid" id="colorGrid">
      <span class="color-option" style="background-color: #7a1030; color: #7a1030;" data-color="#7a1030"></span>
      <span class="color-option" style="background-color: #4a90e2; color: #4a90e2;" data-color="#4a90e2"></span>
      <span class="color-option" style="background-color: #6366f1; color: #6366f1;" data-color="#6366f1"></span>
      <span class="color-option" style="background-color: #a855f7; color: #a855f7;" data-color="#a855f7"></span>
      <span class="color-option" style="background-color: #ec4899; color: #ec4899;" data-color="#ec4899"></span>
      <span class="color-option" style="background-color: #f97316; color: #f97316;" data-color="#f97316"></span>
      <span class="color-option" style="background-color: #22c55e; color: #22c55e;" data-color="#22c55e"></span>
      <span class="color-option" style="background-color: #06b6d4; color: #06b6d4;" data-color="#06b6d4"></span>
    </div>
  </div>

  <div class="card">
    <p class="card-title" data-i18n="presets">Preset themes</p>
    <div class="theme-grid" id="themeGrid"></div>
  </div>

  <div class="card">
    <p class="card-title" data-i18n="language">Language</p>
    <div class="segmented segmented-sm" id="languageSwitch">
      <button type="button" data-lang="auto" data-i18n="languageAuto">Auto</button>
      <button type="button" data-lang="sk">SK</button>
      <button type="button" data-lang="cs">CZ</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>

  <button id="reload-button" class="button" data-i18n="reload">Apply &amp; reload page</button>

  <div class="footer" data-i18n="footer">applies instantly — no flash on reload</div>
  <button type="button" class="credits-link" id="creditsLink" data-i18n="credits">Credits &amp; licenses</button>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
